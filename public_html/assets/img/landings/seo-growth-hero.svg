<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C2CB"/>
      <stop offset="50%" stop-color="#FF2400"/>
      <stop offset="100%" stop-color="#FFD400"/>
    </linearGradient>

    <linearGradient id="areaFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF2400" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF2400" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2400" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF2400" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="1000" fill="url(#bgFade)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
    <line x1="90"  y1="120" x2="90"  y2="820"/>
    <line x1="280" y1="120" x2="280" y2="820"/>
    <line x1="470" y1="120" x2="470" y2="820"/>
    <line x1="660" y1="120" x2="660" y2="820"/>
    <line x1="850" y1="120" x2="850" y2="820"/>

    <line x1="90" y1="820" x2="850" y2="820"/>
    <line x1="90" y1="670" x2="850" y2="670"/>
    <line x1="90" y1="520" x2="850" y2="520"/>
    <line x1="90" y1="370" x2="850" y2="370"/>
    <line x1="90" y1="220" x2="850" y2="220"/>
  </g>

  <g font-family="'IBM Plex Mono', monospace" font-size="20" fill="#FFFFFF" fill-opacity="0.35">
    <text x="90" y="855">Q1</text>
    <text x="272" y="855">Q2</text>
    <text x="462" y="855">Q3</text>
    <text x="652" y="855">Q4</text>
    <text x="820" y="855">Q5</text>
  </g>

  <path d="M90,760 C220,740 260,700 280,650 C310,570 400,560 470,480 C540,400 600,340 660,260 C720,190 800,170 850,150 L850,820 L90,820 Z"
        fill="url(#areaFade)"/>

  <path d="M90,760 C220,740 260,700 280,650 C310,570 400,560 470,480 C540,400 600,340 660,260 C720,190 800,170 850,150"
        fill="none" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round" filter="url(#softShadow)"/>

  <g>
    <circle cx="90"  cy="760" r="7" fill="#00C2CB"/>
    <circle cx="280" cy="650" r="7" fill="#00C2CB"/>
    <circle cx="470" cy="480" r="7" fill="#FF2400"/>
    <circle cx="660" cy="260" r="7" fill="#FF2400"/>
  </g>

  <circle cx="850" cy="150" r="60" fill="url(#dotGlow)"/>
  <circle cx="850" cy="150" r="10" fill="#FFD400"/>
  <circle cx="850" cy="150" r="10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5"/>

  <g transform="translate(620,300)" filter="url(#softShadow)">
    <rect x="0" y="0" width="230" height="88" rx="16" fill="#11172A" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="34" cy="44" r="16" fill="none" stroke="#FFD400" stroke-width="4"/>
    <text x="34" y="50" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#FFD400">1</text>
    <text x="64" y="38" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Google Ranking</text>
    <text x="64" y="62" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#00C2CB">Position #1 reached</text>
  </g>

  <g transform="translate(120,230)" filter="url(#softShadow)">
    <rect x="0" y="0" width="200" height="80" rx="16" fill="#11172A" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M20 46 l10 -10 l8 8 l16 -18" fill="none" stroke="#FF2400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="28" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Organic Traffic</text>
    <text x="20" y="66" font-family="'IBM Plex Mono', monospace" font-size="22" font-weight="700" fill="#FF2400">+184%</text>
  </g>

  <g transform="translate(90,900)" font-family="'Space Grotesk', sans-serif">
    <circle cx="14" cy="0" r="14" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.85"/>
    <line x1="24" y1="10" x2="40" y2="26" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
    <text x="58" y="6" font-size="20" fill="#FFFFFF" fill-opacity="0.7">Sustainable, data-driven SEO growth</text>
  </g>
</svg>
